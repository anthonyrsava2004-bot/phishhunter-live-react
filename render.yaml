services:
  - type: web
    name: phishhunter-live-react
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && cd frontend && npm install && npm run build && cd ..
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: database/phishhunter.db
      - key: HTTP_TIMEOUT
        value: "4.0"
      - key: MAX_REDIRECT_HOPS
        value: "7"
